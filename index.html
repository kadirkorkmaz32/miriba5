
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Bir Çiçek 🌷</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe0ec, #e7d9ff);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .scene {
    text-align: center;
    animation: appear 1.5s ease;
  }
  .cat {
    font-size: 125px;
    animation: bounce 2s infinite ease-in-out;
  }
  .flower {
    font-size: 75px;
    display: inline-block;
    animation: give 3s infinite ease-in-out;
  }
  h1 {
    color: #a64d79;
    font-size: 27px;
  }
  p { color: #925477; font-size: 18px; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  @keyframes give {
    0%,100% { transform: translate(0,0) rotate(-10deg); }
    50% { transform: translate(35px,-12px) rotate(15deg); }
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(.5); }
    to { opacity: 1; transform: scale(1); }
  }
  .heart {
    position: absolute;
    bottom: -30px;
    color: #ff6b9d;
    font-size: 25px;
    animation: float 5s linear infinite;
  }
  @keyframes float {
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="scene">
  <div class="flower">🌷</div>
  <div class="cat">🐱</div>
  <h1>Bu çiçek senin için! 💗</h1>
  <p>Çünkü bugün de gülümsemeyi hak ediyorsun.</p>
</div>
<script>
  for(let i=0; i<25; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💗";
    h.style.left = Math.random()*100 + "vw";
    h.style.animationDelay = Math.random()*5 + "s";
    h.style.animationDuration = (4+Math.random()*4) + "s";
    document.body.appendChild(h);
  }
</script>
</body>
</html>
